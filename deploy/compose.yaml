services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 120s
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      API_TOKEN_FILE: /run/secrets/api_token
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-52428800}
      MAX_PIXELS: ${MAX_PIXELS:-40000000}
      QUOTA_BYTES: ${QUOTA_BYTES:-10737418240}
      MIN_FREE_BYTES: ${MIN_FREE_BYTES:-2147483648}
    secrets:
      - api_token
    volumes:
      - app_data:/app/data
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
  caddy:
    image: caddy:2.10.2-alpine
    profiles: [https]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
secrets:
  api_token:
    file: ${API_TOKEN_PATH:-../secrets/api-token.txt}
volumes:
  app_data:
  caddy_data:
  caddy_config:
